name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Install arduino-cli
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="${RUNNER_TEMP}/bin" sh
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Show arduino-cli version
        run: arduino-cli version

      - name: Run host-side contract tests
        run: python -m unittest discover -s tests -p "*_test.py"

      - name: Compile Spotify examples
        run: python scripts/compile_examples.py --fqbn esp8266:esp8266:nodemcuv2
